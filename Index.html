/* =====================================================
   TEST VARIABLES
===================================================== */

let current = 0;
let score = 0;
let studentName = "";
let wrongAnswers = [];


/* =====================================================
   START TEST
===================================================== */

function startTest(){

    studentName =
        document.getElementById("studentName").value.trim();

    if(studentName === ""){

        alert("Please enter student name.");

        return;
    }

    document.getElementById("startPage")
    .style.display = "none";

    document.getElementById("testArea")
    .style.display = "block";

    document.getElementById("showName")
    .textContent = studentName;

    showQuestion();
}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    let item = questions[current];

    document.getElementById("progress")
    .textContent =
        "Question " +
        (current + 1) +
        " of " +
        questions.length;

    document.getElementById("question")
    .textContent = item.q;

    document.getElementById("options")
    .innerHTML = "";

    document.getElementById("feedback")
    .innerHTML = "";

    document.getElementById("nextBtn")
    .style.display = "none";


    item.o.forEach(function(option,index){

        let button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index)
            + ". "
            + option;

        button.onclick =
            function(){

                checkAnswer(index,button);

            };

        document.getElementById("options")
        .appendChild(button);

    });

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(selected,button){

    let item = questions[current];

    let all =
        document.querySelectorAll(".option");

    all.forEach(function(btn){

        btn.disabled = true;

    });


    if(selected === item.a){

        score++;

        button.classList.add("correct");

        document.getElementById("feedback")
        .innerHTML =
            '<div style="background:#d9f6df;padding:12px;border-radius:8px;color:green">' +
            "✓ Correct Answer!" +
            "</div>";

    }

    else{

        button.classList.add("wrong");

        all[item.a]
        .classList.add("correct");


        wrongAnswers.push({

            number: current + 1,

            question: item.q,

            selected:
                item.o[selected],

            correct:
                item.o[item.a],

            explanation:
                item.e

        });


        document.getElementById("feedback")
        .innerHTML =

            '<div style="background:#fff0f0;padding:12px;border-radius:8px;color:#c62828">' +

            "<b>✗ Wrong Answer</b><br><br>" +

            "<b>Your answer:</b> " +
            item.o[selected] +

            "<br><br>" +

            "<b>✓ Correct answer:</b> " +
            item.o[item.a] +

            "<br><br>" +

            "<b>Explanation:</b> " +
            item.e +

            "</div>";

    }


    document.getElementById("nextBtn")
    .style.display = "inline-block";


    if(current === questions.length - 1){

        document.getElementById("nextBtn")
        .textContent = "Show Final Result";

    }

    else{

        document.getElementById("nextBtn")
        .textContent = "Next Question";

    }

}


/* =====================================================
   NEXT
===================================================== */

document.getElementById("nextBtn")
.onclick = function(){

    current++;

    if(current < questions.length){

        showQuestion();

    }

    else{

        showResult();

    }

};


/* =====================================================
   FINAL RESULT
===================================================== */

function showResult(){

    document.getElementById("testArea")
    .style.display = "none";

    document.getElementById("result")
    .style.display = "block";


    let percentage =
        Math.round(
            (score / questions.length) * 100
        );


    document.getElementById("finalStudent")
    .textContent =
        "Student: " + studentName;


    document.getElementById("score")
    .textContent =
        "Score: " +
        score +
        " / " +
        questions.length;


    document.getElementById("percentage")
    .textContent =
        "Percentage: " +
        percentage +
        "%";


    let message = "";

    if(percentage >= 80){

        message =
            "🌟 Excellent performance! Keep it up.";

    }

    else if(percentage >= 60){

        message =
            "👍 Good performance. Keep practicing.";

    }

    else if(percentage >= 40){

        message =
            "📚 Keep studying and practice more MCQs.";

    }

    else{

        message =
            "💪 Don't worry. Revise the kidney chapter and try again.";

    }


    document.getElementById("resultMessage")
    .innerHTML =
        "<p><b>" +
        message +
        "</b></p>";


    /* WRONG QUESTIONS */

    let wrongHTML = "";


    if(wrongAnswers.length === 0){

        wrongHTML =
            '<div style="background:#d9f6df;padding:15px;border-radius:9px">' +
            "🎉 Excellent! You answered every MCQ correctly." +
            "</div>";

    }

    else{

        wrongAnswers.forEach(function(item){

            wrongHTML +=

            '<div class="wrongExplanation">' +

            "<b>Question " +
            item.number +
            ":</b><br><br>" +

            item.question +

            "<br><br>" +

            "<b>Your answer:</b> " +
            item.selected +

            "<br>" +

            "<b>Correct answer:</b> " +
            item.correct +

            "<br><br>" +

            "<b>Explanation:</b><br>" +
            item.explanation +

            "</div>";

        });

    }


    document.getElementById("wrongList")
    .innerHTML = wrongHTML;

}
